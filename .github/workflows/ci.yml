name: CI

# 三层验证里，前两层能在公开 runner 上跑；端到端需要装了 DSH 的机器，
# 走自托管 runner，由仓库变量 DSH_E2E_RUNNER 打开（见 README「持续集成」）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: 单测 / 语法 / 构建 / 打包（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    # Windows runner 默认是 PowerShell，重定向会写成 UTF-16；统一用 Git Bash。
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖（严格按 lockfile）
        run: npm ci

      - name: 单元测试
        run: npm test

      - name: Host 与共享模块语法检查
        run: npm run check

      - name: 构建浏览器模块
        run: npm run build

      - name: 校验 lib/ 与源码一致
        # lib/ 会随源码一起提交（GitHub 源码安装依赖它）；构建后必须没有差异。
        run: test -f lib/client.js && git diff --exit-code -- lib

      - name: 生成打包清单
        # --ignore-scripts：build 已在上一跑过，这里只要纯 JSON 输出（prepack 的日志会污染 stdout）。
        run: npm pack --dry-run --json --ignore-scripts > pack.json

      - name: 校验打包内容
        run: node scripts/assert-pack.mjs pack.json

      - name: 保留打包清单
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pack-manifest-${{ matrix.os }}
          path: pack.json
          if-no-files-found: ignore

  e2e:
    name: 端到端（真实 Host + 临时 profile）
    needs: checks
    # 没配自托管 runner 时整个 job 跳过，不会挂起等待。
    if: vars.DSH_E2E_RUNNER == 'true'
    runs-on: [self-hosted, dsh]
    env:
      # 留空则回退到 PATH 上的 dsh，再回退到桌面应用自带的 launcher。
      DSH_BIN: ${{ vars.DSH_BIN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        run: npm ci

      - name: 构建浏览器模块
        run: npm run build

      - name: 校验 lib/ 与源码一致
        # lib/ 会随源码一起提交（GitHub 源码安装依赖它）；构建后必须没有差异。
        run: test -f lib/client.js && git diff --exit-code -- lib

      - name: 接口层端到端
        # DSH_E2E_REQUIRED=1：找不到 dsh 时不能 SKIP 成绿灯。
        env:
          DSH_E2E_REQUIRED: '1'
        run: npm run test:e2e

      - name: Registry 边界验收（本地假 Registry）
        env:
          DSH_E2E_REQUIRED: '1'
        run: npm run test:registry

      - name: OAuth 授权验收（本地假授权服务器）
        env:
          DSH_E2E_REQUIRED: '1'
        run: npm run test:oauth

      - name: 页面层端到端
        # 这些端到端都默认占用 127.0.0.1:3080，必须串行跑。
        env:
          DSH_E2E_REQUIRED: '1'
          CHROME_PATH: ${{ vars.DSH_E2E_CHROME_PATH }}
        run: npm run test:ui

      - name: 模拟来源功能验收（假 HOME，各客户端写法 + 密钥）
        env:
          DSH_E2E_REQUIRED: '1'
        run: npm run test:simulated

      - name: 布局验收（浅色 / 深色 / 窄窗口）
        env:
          DSH_E2E_REQUIRED: '1'
          CHROME_PATH: ${{ vars.DSH_E2E_CHROME_PATH }}
        run: npm run test:layout

      - name: 保留失败截图
        # test:ui 失败时把现场页面写到 tests/e2e/artifacts/，这里收进 artifact。
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-failure
          path: tests/e2e/artifacts/
          if-no-files-found: ignore
